<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Availability Calendar - Mimilini</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: #F1F4F9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .calendar-card {
      background: #FFFFFF;
      width: 100%;
      max-width: 440px;
      border-radius: 36px;
      padding: 36px 32px 32px 32px;
      box-shadow: 0 20px 45px rgba(28, 39, 60, 0.08);
      position: relative;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .nav-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #F1F4F9;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #64748B;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      background: #E2E8F0;
      color: #1E293B;
      transform: scale(1.05);
    }

    .nav-btn svg {
      width: 18px;
      height: 18px;
    }

    .month-title {
      font-size: 20px;
      font-weight: 700;
      color: #1E293B;
      letter-spacing: -0.3px;
    }

    .weekdays-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      margin-bottom: 12px;
    }

    .weekday {
      font-size: 14px;
      font-weight: 600;
      color: #94A3B8;
      padding-bottom: 10px;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      row-gap: 8px;
      margin-bottom: 24px;
    }

    .day-cell {
      height: 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      border-radius: 14px;
      transition: background 0.15s ease;
    }

    .day-cell:hover:not(.empty) {
      background: #F8FAFC;
    }

    .day-number {
      font-size: 16px;
      font-weight: 500;
      color: #1E293B;
      line-height: 1.2;
    }

    .day-cell.dimmed .day-number {
      color: #CBD5E1;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-top: 5px;
      display: block;
    }

    /* Status Colors matching Figma design */
    .dot-available { background-color: #10B981; }
    .dot-booked { background-color: #F43F5E; }
    .dot-blocked { background-color: #94A3B8; }
    .dot-vacation { background-color: #F59E0B; }
    .dot-today { background-color: #F43F5E; }

    .divider {
      height: 1px;
      background: #E2E8F0;
      margin: 16px 0 20px 0;
    }

    .legend-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 20px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #64748B;
      font-weight: 500;
    }

    .legend-item .indicator {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="calendar-card">
    <!-- Header -->
    <div class="calendar-header">
      <button class="nav-btn" onclick="prevMonth()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
        </svg>
      </button>
      <div class="month-title" id="monthTitle">July 2026</div>
      <button class="nav-btn" onclick="nextMonth()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    </div>

    <!-- Weekdays Header -->
    <div class="weekdays-grid">
      <div class="weekday">Mo</div>
      <div class="weekday">Tu</div>
      <div class="weekday">We</div>
      <div class="weekday">Th</div>
      <div class="weekday">Fr</div>
      <div class="weekday">Sa</div>
      <div class="weekday">Su</div>
    </div>

    <!-- Days Grid -->
    <div class="days-grid" id="daysGrid"></div>

    <div class="divider"></div>

    <!-- Legend -->
    <div class="legend-container">
      <div class="legend-row">
        <div class="legend-item">
          <span class="indicator dot-available"></span>
          <span>Available</span>
        </div>
        <div class="legend-item">
          <span class="indicator dot-booked"></span>
          <span>Booked</span>
        </div>
        <div class="legend-item">
          <span class="indicator dot-blocked"></span>
          <span>Blocked</span>
        </div>
        <div class="legend-item">
          <span class="indicator dot-vacation"></span>
          <span>Vacation</span>
        </div>
      </div>
      <div class="legend-row">
        <div class="legend-item">
          <span class="indicator dot-today"></span>
          <span>Today</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Sample mock matching the exact API response from GET /api/v1/schedules/calendar/:artistId?month=2026-07
    const mockApiResponse = {
      month: "2026-07",
      monthName: "July 2026",
      startDayOffset: 2, // July 1, 2026 is Wednesday (index 2 in Monday-based week)
      days: [
        { dayNumber: 1, status: "off", hasDot: false, isDimmed: true },
        { dayNumber: 2, status: "booked", dotColor: "#F43F5E", hasDot: true },
        { dayNumber: 3, status: "booked", dotColor: "#F43F5E", hasDot: true },
        { dayNumber: 4, status: "booked", dotColor: "#F43F5E", hasDot: true },
        { dayNumber: 5, status: "off", hasDot: false },
        { dayNumber: 6, status: "off", hasDot: false },
        { dayNumber: 7, status: "available", dotColor: "#10B981", hasDot: true },
        { dayNumber: 8, status: "available", dotColor: "#10B981", hasDot: true },
        { dayNumber: 9, status: "booked", dotColor: "#F43F5E", hasDot: true },
        { dayNumber: 10, status: "blocked", dotColor: "#94A3B8", hasDot: true },
        { dayNumber: 11, status: "blocked", dotColor: "#94A3B8", hasDot: true },
        { dayNumber: 12, status: "off", hasDot: false },
        { dayNumber: 13, status: "off", hasDot: false },
        { dayNumber: 14, status: "available", dotColor: "#10B981", hasDot: true },
        { dayNumber: 15, status: "booked", dotColor: "#F43F5E", hasDot: true },
        { dayNumber: 16, status: "available", dotColor: "#10B981", hasDot: true },
        { dayNumber: 17, status: "booked", dotColor: "#F43F5E", hasDot: true },
        { dayNumber: 18, status: "booked", dotColor: "#F43F5E", hasDot: true },
        { dayNumber: 19, status: "off", hasDot: false },
        { dayNumber: 20, status: "off", hasDot: false },
        { dayNumber: 21, status: "vacation", dotColor: "#F59E0B", hasDot: true },
        { dayNumber: 22, status: "vacation", dotColor: "#F59E0B", hasDot: true },
        { dayNumber: 23, status: "vacation", dotColor: "#F59E0B", hasDot: true },
        { dayNumber: 24, status: "vacation", dotColor: "#F59E0B", hasDot: true },
        { dayNumber: 25, status: "vacation", dotColor: "#F59E0B", hasDot: true },
        { dayNumber: 26, status: "off", hasDot: false },
        { dayNumber: 27, status: "off", hasDot: false },
        { dayNumber: 28, status: "available", dotColor: "#10B981", hasDot: true },
        { dayNumber: 29, status: "available", dotColor: "#10B981", hasDot: true },
        { dayNumber: 30, status: "booked", dotColor: "#F43F5E", hasDot: true },
        { dayNumber: 31, status: "available", dotColor: "#10B981", hasDot: true }
      ]
    };

    function renderCalendar() {
      const grid = document.getElementById('daysGrid');
      grid.innerHTML = '';

      // Blank slots before 1st of month
      for (let i = 0; i < mockApiResponse.startDayOffset; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-cell empty';
        grid.appendChild(emptyCell);
      }

      // Render each day
      mockApiResponse.days.forEach(day => {
        const cell = document.createElement('div');
        cell.className = 'day-cell' + (day.isDimmed ? ' dimmed' : '');
        
        const num = document.createElement('span');
        num.className = 'day-number';
        num.innerText = day.dayNumber;
        cell.appendChild(num);

        if (day.hasDot && day.dotColor) {
          const dot = document.createElement('span');
          dot.className = 'status-dot';
          dot.style.backgroundColor = day.dotColor;
          cell.appendChild(dot);
        }

        cell.onclick = () => {
          alert(`Date: ${day.dayNumber} July 2026\nStatus: ${day.status.toUpperCase()}`);
        };

        grid.appendChild(cell);
      });
    }

    function prevMonth() {
      alert("Navigate to previous month: June 2026");
    }

    function nextMonth() {
      alert("Navigate to next month: August 2026");
    }

    renderCalendar();
  </script>
</body>
</html>
